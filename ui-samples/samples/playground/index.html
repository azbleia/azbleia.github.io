<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Button Playground — DisplayXR UI samples</title>
  <!-- Opt this page into the DisplayXR Browser's lens-aware filtering of 2D content. -->
  <meta name="displayxr-2d-lens-filter" content="on" />
  <script type="module" crossorigin src="../../assets/playground-C1-gKxko.js"></script>
  <link rel="modulepreload" crossorigin href="../../assets/cursor-CaUQTGcf.js">
  <link rel="stylesheet" crossorigin href="../../assets/cursor-QJGs-BZh.css">
  <link rel="stylesheet" crossorigin href="../../assets/playground-Dy2yi5ps.css">
</head>
<body>
  <canvas id="stage" aria-hidden="true"></canvas>

  <main class="ui">
    <header class="top">
      <a class="back" href="../../" data-lift>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
        Samples
      </a>
      <h1>Button Playground</h1>
      <label class="switch"><input type="checkbox" id="hold" /> Hold all lifted</label>
      <label class="switch" title="The pointer rises to the depth of whatever is under it, so it is never drawn behind a lifted control"><input type="checkbox" id="cursor" /> Depth cursor</label>
      <span class="mode" id="mode">Starting…</span>
    </header>

    <!-- Rows are effects, columns are button styles. Built by main.ts from PRESETS. -->
    <section class="panel compare" data-surface>
      <div class="grid" id="grid"></div>
    </section>

    <aside class="panel tune" data-surface>
      <h2>Custom <small>the last row</small></h2>
      <div class="field">
        <label for="textCm">Text on hover</label>
        <input type="range" id="textCm" min="-1" max="1.5" step="0.05" />
      </div>
      <div class="field">
        <label for="faceCm">Face on hover</label>
        <input type="range" id="faceCm" min="-1.5" max="1" step="0.05" />
      </div>
      <div class="field">
        <label for="restCm">Text at rest</label>
        <input type="range" id="restCm" min="-1" max="1.5" step="0.05" />
      </div>
      <div class="field">
        <label for="restFaceCm">Face at rest</label>
        <input type="range" id="restFaceCm" min="-1.5" max="1" step="0.05" />
      </div>
      <div class="field two">
        <label for="shadow">Shadow sits</label>
        <select id="shadow">
          <option value="face">on the face</option>
          <option value="text">with the text</option>
          <option value="none">nowhere</option>
        </select>
      </div>
      <div class="field two">
        <label for="press">Press</label>
        <select id="press">
          <option value="face">down to the face</option>
          <option value="glass">all flat on the glass</option>
          <option value="rest">back to rest</option>
          <option value="depths">to the click depths</option>
          <option value="none">nowhere</option>
        </select>
      </div>
      <div class="field">
        <label for="pressCm">Text on click</label>
        <input type="range" id="pressCm" min="-1.5" max="1.5" step="0.05" />
      </div>
      <div class="field">
        <label for="pressFaceCm">Face on click</label>
        <input type="range" id="pressFaceCm" min="-1.5" max="1" step="0.05" />
      </div>
      <div class="field two">
        <label for="plate">Whole button as one layer</label>
        <input type="checkbox" id="plate" />
      </div>
      <div class="field two">
        <label for="cast">Casts a shadow on the glass</label>
        <input type="checkbox" id="cast" />
      </div>
      <div class="field">
        <label for="ease">Ease</label>
        <input type="range" id="ease" min="0" max="600" step="10" />
      </div>

      <h2 class="sub">Label shadow <small>every row</small></h2>
      <div class="field">
        <label for="alpha">Opacity</label>
        <input type="range" id="alpha" min="0" max="1" step="0.05" />
      </div>
      <div class="field">
        <label for="blur">Diffuse (blur)</label>
        <input type="range" id="blur" min="0" max="1.2" step="0.01" />
      </div>
      <div class="field">
        <label for="thickness">Thickness</label>
        <input type="range" id="thickness" min="0" max="0.3" step="0.01" />
      </div>
      <div class="field">
        <label for="offset">Offset down</label>
        <input type="range" id="offset" min="0" max="0.5" step="0.02" />
      </div>

      <h2 class="sub">Glow <small>what a casting button throws on the glass</small></h2>
      <div class="field two">
        <label for="castColor">Color</label>
        <input type="color" id="castColor" />
      </div>
      <div class="field two">
        <label for="castPressedOn">Color when pressed</label>
        <span class="pair"><input type="checkbox" id="castPressedOn" /><input type="color" id="castPressedColor" /></span>
      </div>
      <div class="field">
        <label for="castAlpha">Opacity</label>
        <input type="range" id="castAlpha" min="0" max="1" step="0.05" />
      </div>
      <div class="field">
        <label for="castBlur">Blur</label>
        <input type="range" id="castBlur" min="0" max="2" step="0.05" />
      </div>
      <div class="field">
        <label for="castOffset">Offset down</label>
        <input type="range" id="castOffset" min="0" max="1" step="0.05" />
      </div>

      <h2 class="sub">Scene</h2>
      <div class="field two">
        <label for="bg">Background</label>
        <input type="color" id="bg" />
      </div>
      <div class="field">
        <label for="cursorGap">Cursor gap</label>
        <input type="range" id="cursorGap" min="0" max="10" step="0.5" />
      </div>

      <h2 class="sub">Markup <small>for the Custom row</small></h2>
      <code id="markup"></code>
      <div class="row actions">
        <button class="btn secondary small" id="reset" type="button">Reset</button>
        <button class="btn secondary small" id="copy" type="button">Copy markup</button>
      </div>
    </aside>
  </main>

</body>
</html>
