<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>World Map</title>
<style>
  :root { --bg: #04100f; --fg: #f1e8d2; --muted: #c9d4cf; --ui: clamp(16px, 1.25vw, 24px); }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden;
    font: var(--ui)/1.5 system-ui, sans-serif; }
  /* The woven canvas must stay visually bare: no border, radius, shadow, mask or filter. */
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  /* UI over the weave: plain translucent tints only (no backdrop-filter). */
  #hud { position: fixed; left: 16px; top: 16px; right: 16px; width: fit-content; color: var(--muted); pointer-events: none;
    background: rgba(2,10,9,.78); padding: .55em .9em; border-radius: 10px; text-shadow: 0 1px 2px #000; }
  #hud b { color: var(--fg); font-weight: 700; }
  #mode { position: fixed; left: 50%; transform: translateX(-50%); bottom: max(72px, 8vh); display: flex; padding: 10px; gap: 8px;
    background: rgba(2,10,9,.82); border: 2px solid rgba(241,232,210,.45); border-radius: 999px;
    font-size: calc(var(--ui) * 2.7); }
  #mode button { all: unset; cursor: pointer; padding: .4em 1.1em; min-width: 2.2em; text-align: center;
    border-radius: 999px; color: var(--fg); font-weight: 700; letter-spacing: .05em; }
  #mode button:hover { background: rgba(241,232,210,.15); }
  #mode button[aria-pressed="true"] { background: var(--fg); color: #0b1a17; }
  #mode button:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }
  #mode button:disabled { opacity: .45; cursor: not-allowed; }
  /* With the 3D buttons drawn in the scene, the DOM toggle stays only as the invisible hit target
     (layout, hover, click, keyboard). Its focus ring stays visible for keyboard users. */
  #mode.in-scene { background: transparent; border-color: transparent; }
  #mode.in-scene button { color: transparent; background: transparent !important; padding-left: 2.3em; }
  #mode.in-scene button:focus-visible { outline: none; }   /* the 3D button lifts on keyboard focus instead */
  /* Auto-hiding UI: shown on mouse/keyboard/touch activity, fades out after a few idle seconds. */
  #hud, #mode, #credit, #tune { transition: opacity .4s ease; }
  body.idle #hud, body.idle #mode, body.idle #credit, body.idle #tune { opacity: 0; pointer-events: none; }
  /* Help text and the depth slider stack in the top-left corner, so they never collide. */
  #topleft { position: fixed; left: 16px; top: 16px; right: 16px; display: flex; flex-direction: column;
    align-items: flex-start; gap: 8px; pointer-events: none; }
  #topleft > #hud { position: static; }
  #tune[hidden] { display: none; }
  #tune { pointer-events: auto; display: flex; align-items: center; gap: .6em;
    background: rgba(2,10,9,.78); padding: .45em .8em; border-radius: 10px; color: var(--fg); }
  #tune input { width: 12em; accent-color: #5f968c; }
  #tune output { min-width: 3.4em; text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }
  html.idle, html.idle * { cursor: none !important; }
  /* On the 3D display the pointer is drawn in the scene at the depth of what's under it. */
  html.cursor3d, html.cursor3d * { cursor: none !important; }
  #credit { position: fixed; left: 16px; bottom: 16px; color: var(--fg); font-size: calc(var(--ui) * .85);
    background: rgba(2,10,9,.78); padding: .3em .7em; border-radius: 8px; }
  #credit a { color: var(--fg); }
  #load { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); color: var(--muted);
    background: rgba(2,10,9,.78); padding: .5em 1em; border-radius: 10px; }
</style>
<script>
// Import map. ?cursor=sdk loads the SDK from the depth-cursor branch build (DisplayXR/displayxr-web
// PR #141, pinned commit) to try its DepthCursor; otherwise the released SDK.
{
  const sdkCursor = new URLSearchParams(location.search).get('cursor') === 'sdk';
  const dxr = sdkCursor
    ? 'https://cdn.jsdelivr.net/gh/DisplayXR/displayxr-web@40227645c3c0fd77873d66b9531cb50c2826dae9/js/'
    : 'https://cdn.jsdelivr.net/npm/@displayxr/inline3d@1.34.0/js/';
  const im = document.createElement('script');
  im.type = 'importmap';
  im.textContent = JSON.stringify({ imports: {
    'three': 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js',
    'three/addons/': 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/',
    '@displayxr/inline3d': dxr + 'inline3d.js',
    '@displayxr/inline3d/three': dxr + 'inline3d-three.js',
  } });
  document.currentScript.after(im);
}
</script>
</head>
<body>
<canvas id="stage"></canvas>
<div id="load">Loading map…</div>
<div id="topleft">
<div id="hud">
  <b>− / =</b> depth <span id="d"></span> · <b>L</b> light · <b>T</b> 2D/3D · <b>C</b> cursor <span id="anchor"></span> · <b>H</b> hide
</div>
<div id="tune" hidden><label for="uidepth">Button depth</label>
  <input id="uidepth" type="range" min="0" max="3" step="0.05" value="0.6"><output id="uidepthv" for="uidepth">0.60×</output></div>
</div>
<div id="credit"><a href="https://www.vecteezy.com/photo/71161499-detailed-world-map-is-shown-with-beige-continents-and-a-turquoise-sea-background" target="_blank" rel="noopener">World map photo by Vecteezy</a></div>
<div id="mode" role="group" aria-label="Display mode">
  <button data-mode="2d" aria-pressed="false">2D</button>
  <button data-mode="3d" aria-pressed="true">3D</button>
</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { createInline3D, inline3dDisplayModesSupported, inline3dViewRigSupported } from '@displayxr/inline3d';
import * as dxrThree from '@displayxr/inline3d/three';
const { EyeCamera, displayRig } = dxrThree;   // DepthCursor only exists in the ?cursor=sdk build

const q = new URLSearchParams(location.search);
const canvas = document.getElementById('stage');

// ---- scene -------------------------------------------------------------------------------
// Display-rig authoring: the canvas is a portal whose plane is world z = 0 (zero disparity),
// +z toward the viewer. The map is MAP_W metres wide and the portal is sized to it (cover).
const MAP_W = 0.4;
const MAP_ASPECT = 2000 / 1121;
const RELIEF = 0.035;      // relief.glb height / width, from build.py --relief
const FOCUS = 0.4;         // fraction of the relief that sits behind the glass
const state = { depth: +(q.get('depth') ?? 1.0), lightMode: 0,
  // Cursor placement: 'world' = a fixed point in the scene in front of the pointer (real motion
  // parallax); 'head' = on the line from the eyes through the pointer (DepthCursor's default:
  // always covers the pointer from the viewer's position, no parallax). C toggles.
  anchor: q.get('anchor') === 'head' ? 'head' : 'world',
  // Depth multiplier for the in-scene buttons (stand-out, hover, press, bowl, label lift, icons).
  uiDepth: 0.6 };

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(1);              // viewports are backing-store px; we size the store ourselves
renderer.autoClear = false;             // one clear per frame, then one draw per eye
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.AgXToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x04100f);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.55;

// Key light: low, warm, upper-left — matches the light baked into the photo.
const key = new THREE.DirectionalLight(0xfff1dc, 1.6);
key.castShadow = true;
key.shadow.mapSize.set(4096, 4096);
key.shadow.bias = -0.0002;
key.shadow.normalBias = 0.0008;
key.shadow.radius = 3;
key.shadow.autoUpdate = false;   // static scene: re-render its shadows only when something changes
const fill = new THREE.HemisphereLight(0x9fd6cf, 0x0a1a18, 0.35);
scene.add(key, key.target, fill);

const map = new THREE.Group();          // scale.z carries the depth exaggeration
let heightGrid = null;                  // relief vertex grid, for the 3D cursor's depth
scene.add(map);

const lights = [
  [-0.6, 0.5, 0.55, 1.6],  // raking upper-left (default)
  [0.0, 0.3, 1.0, 1.3],    // front, soft
  [-0.9, 0.15, 0.3, 2.0],  // very low raking — dramatic relief
];
function apply() {
  map.scale.set(MAP_W, MAP_W, MAP_W * state.depth);
  map.position.z = -FOCUS * RELIEF * MAP_W * state.depth;
  const [lx, ly, lz, li] = lights[state.lightMode];
  key.position.set(lx, ly, lz);
  key.intensity = li;
  const s = key.shadow.camera, h = MAP_W * 0.6;
  s.left = -h; s.right = h; s.top = h; s.bottom = -h; s.near = 0.05; s.far = 3;
  s.updateProjectionMatrix();
  key.shadow.needsUpdate = true;
  uiKey?.position.copy(key.position);
  if (uiKey) uiKey.intensity = li;
  document.getElementById('d').textContent = `(${state.depth.toFixed(2)}×)`;
}
apply();

new GLTFLoader().load('out/relief.glb', (gltf) => {
  const mesh = gltf.scene;
  mesh.traverse((o) => {
    if (!o.isMesh) return;
    o.castShadow = o.receiveShadow = true;
    o.material.normalScale = new THREE.Vector2(0.8, 0.8);
    if (o.material.map) o.material.map.anisotropy = renderer.capabilities.getMaxAnisotropy();
    // The relief is a regular grid (build.py): keep its vertices to look up surface height.
    const pa = o.geometry.attributes.position.array;
    let gw = 1;
    while (gw * 3 + 1 < pa.length && pa[gw * 3 + 1] === pa[1]) gw++;
    heightGrid = { pa, gw, gh: Math.round(pa.length / 3 / gw) };
  });
  map.add(mesh);
  apply();
  document.getElementById('load').remove();
}, undefined, (e) => {
  document.getElementById('load').textContent = 'Failed to load out/relief.glb — serve this folder over http.';
  console.error(e);
});

// ---- framing -----------------------------------------------------------------------------
// Cover: the portal is as tall as the map, or shorter when the window is wider than the map,
// so the map always fills the frame edge to edge.
const aspect = () => (canvas.clientWidth || 16) / (canvas.clientHeight || 9);
const portalHeight = () => Math.min(MAP_W / MAP_ASPECT, MAP_W / aspect());

// Flat fallback camera for browsers without inline-3D: narrow FOV, framed like the portal.
const FOV = +(q.get('fov') ?? 20);
const monoCam = new THREE.PerspectiveCamera(FOV, 16 / 9, 0.01, 20);
function frameMono() {
  monoCam.aspect = aspect();
  monoCam.updateProjectionMatrix();
  const d = portalHeight() / 2 / Math.tan(THREE.MathUtils.degToRad(FOV / 2));
  monoCam.position.set(0, 0, d);
  monoCam.lookAt(0, 0, 0);
}

// ---- backing store -----------------------------------------------------------------------
// Double-width (left eye | right eye) while woven, 1:1 on the flat fallback. setSize clears
// the buffer even for an identical size, so compare first and repaint immediately on change.
let sbs = false;
let viewScale = { x: 1, y: 1 };
function sizeStore() {
  const dpr = window.devicePixelRatio || 1;
  const w = Math.max(1, Math.round(canvas.clientWidth * dpr * viewScale.x));
  const h = Math.max(1, Math.round(canvas.clientHeight * dpr * viewScale.y));
  const bufW = sbs ? w * 2 : w;
  frameMono();
  if (canvas.width === bufW && canvas.height === h) return false;
  renderer.setSize(bufW, h, false);
  return true;
}

// ---- inline-3D frame loop ----------------------------------------------------------------
const eyes = [new EyeCamera(THREE), new EyeCamera(THREE)];
const good = [0, 1].map(() => ({ proj: new Float32Array(16), pose: new Float32Array(16), vp: null }));
let goodCount = 0;
let viewCount = 2;              // views the active rendering mode delivers (1 in 2D mode)

function drawEyes(n, setEye) {
  updateButtons3D(performance.now());
  updateCursor3D(performance.now());
  renderer.clear();
  renderer.setScissorTest(true);
  for (let i = 0; i < n; i++) {
    const vp = good[i].vp;
    renderer.setViewport(vp.x, vp.y, vp.width, vp.height);
    renderer.setScissor(vp.x, vp.y, vp.width, vp.height);
    setEye(i);
    renderer.render(scene, eyes[i].camera);
    renderer.clearDepth();
    // The UI always uses the real head-tracked eye, so it stays 3D when the map goes 2D.
    eyes[i].setFromMatrices(good[i].proj, good[i].pose);
    renderer.render(uiScene, eyes[i].camera);
  }
  renderer.setScissorTest(false);
}
// Soft 2D: rather than switching the display's mode (whose return to 3D currently leaves the
// lens off), ease both eyes onto one fixed viewpoint: centred on the canvas at the panel's
// nominal viewing distance. At stereo = 0 both halves get the same image from a viewpoint that
// ignores head position, so the woven result is flat with no look-around, while the lens and
// weave stay on. Until that viewpoint is known, the eyes' live midpoint stands in.
let stereo = 1, stereoFrom = 1, stereoTo = 1, stereoT0 = 0;
const STEREO_EASE_MS = 500;
const NEAR = 0.01, FAR = 20;    // same depth range as the session (updateRenderState below)
let nominal = null;             // { proj, pose } of the fixed 2D viewpoint
async function updateNominal() {
  if (!handle) return;
  const m = await handle.displayMetrics();
  const H = portalHeight(), W = H * aspect();
  const z = m.nominalViewerM * (H / m.canvasSizeM[1]);   // metres on the panel -> scene units
  const proj = new THREE.Matrix4().makePerspective(
    -W / 2 * NEAR / z, W / 2 * NEAR / z, H / 2 * NEAR / z, -H / 2 * NEAR / z, NEAR, FAR);
  const pose = new THREE.Matrix4().makeTranslation(0, 0, z);
  nominal = { proj: Float32Array.from(proj.elements), pose: Float32Array.from(pose.elements) };
}
function stepStereo(now) {
  const t = Math.min(1, (now - stereoT0) / STEREO_EASE_MS);
  const e = t * t * (3 - 2 * t);
  stereo = stereoFrom + (stereoTo - stereoFrom) * e;
}
const blended = [0, 1].map(() => ({ proj: new Float32Array(16), pose: new Float32Array(16) }));
function setBlendedEye(i, n) {
  const a = good[i], out = blended[i], k = 1 - stereo;
  if (stereo >= 1 || (!nominal && n < 2)) return eyes[i].setFromMatrices(a.proj, a.pose);
  const b = nominal ?? good[1 - i], kk = nominal ? k : 0.5 * k;
  for (let j = 0; j < 16; j++) {
    out.proj[j] = a.proj[j] + (b.proj[j] - a.proj[j]) * kk;
    out.pose[j] = a.pose[j] + (b.pose[j] - a.pose[j]) * kk;
  }
  eyes[i].setFromMatrices(out.proj, out.pose);
}
function replayLastGood() {
  if (!goodCount) return;       // before the first good frame do nothing, not even clear
  stepStereo(performance.now());
  drawEyes(goodCount, (i) => setBlendedEye(i, goodCount));
}
// ?debug: every 2 s, report the stereo state to the dev server's access log (a 404 GET whose URL
// is the message). Eye separation is measured from this frame's two view poses.
const DEBUG = q.has('debug');
let dbgT = 0;
function debugReport(views) {
  const now = performance.now();
  if (!DEBUG || now - dbgT < 500) return;
  dbgT = now;
  const pose = (v) => (v.transform ? v.transform.matrix : v.transformMatrix);
  let sep = -1, eye0 = [];
  if (views && views.length >= 2) {
    const a = pose(views[0]), b = pose(views[1]);
    sep = Math.hypot(a[12] - b[12], a[13] - b[13], a[14] - b[14]);
    eye0 = [a[12], a[13], a[14]].map((x) => +x.toFixed(4));
  }
  const info = {
    views: views ? views.length : 0, sep: +sep.toFixed(5), eye0, stereo: +stereo.toFixed(3), stereoTo,
    viewCount, hw: wall?.hardwareDisplayState ?? null, tracking: wall?.trackingState ?? null,
    sdkCursor: !!sdkCursor, nominal: !!nominal, mode3d: btn3d.getAttribute('aria-pressed'),
    cur: sdkCursor ? { active: sdkCursor.placement.active,
      d: +(sdkCursor.placement.disparity ?? NaN).toFixed(4), target: +(sdkCursor.placement.targetDisparity ?? NaN).toFixed(4),
      hitZ: sdkHitZ === null ? null : +sdkHitZ.toFixed(4), uiHits: sdkUiHits,
      uv: sdkCursor.pointer.uv && sdkCursor.pointer.uv.map((x) => +x.toFixed(3)),
      hover: pills.map((p) => p.hover), uiVisible: uiGroup.visible } : null,
  };
  fetch('/__dbg?' + encodeURIComponent(JSON.stringify(info))).catch(() => {});
}
function onFrame(views, layer) {
  debugReport(views);
  if (sdkCursor && views && views.length >= 2) {
    sdkUiHits = 0;
    sdkCursor.update(views);
    if (sdkCursor.placement.active && state.anchor === 'world') anchorSdkCursor();
    // It hides the CSS cursor on the canvas only; hide it page-wide (buttons too) while it shows.
    document.documentElement.classList.toggle('cursor3d', !!sdkCursor.placement.active);
  }
  // Validate everything before clearing: a short view list or a null viewport must replay the
  // last good frame, never leave a black or stale canvas for the weave to read.
  const need = Math.min(viewCount, 2);
  if (!views || views.length < need || !layer) return replayLastGood();
  const n = Math.min(views.length, 2);
  const vps = [];
  for (let i = 0; i < n; i++) {
    const vp = layer.getViewport(views[i]);
    if (!vp || vp.width <= 0 || vp.height <= 0) return replayLastGood();
    vps.push(vp);
  }
  for (let i = 0; i < n; i++) {
    good[i].proj.set(views[i].projectionMatrix);
    good[i].pose.set(views[i].transform.matrix);
    good[i].vp = { x: vps[i].x, y: vps[i].y, width: vps[i].width, height: vps[i].height };
  }
  goodCount = n;
  if (n >= 2) {
    const a = good[0].pose, b = good[1].pose;
    eyeMid = [(a[12] + b[12]) / 2, (a[13] + b[13]) / 2, (a[14] + b[14]) / 2];
  }
  stepStereo(performance.now());
  drawEyes(n, (i) => setBlendedEye(i, n));
}

// ---- flat fallback loop ------------------------------------------------------------------
function monoTick() {
  updateButtons3D(performance.now());
  renderer.clear();
  renderer.setViewport(0, 0, canvas.width, canvas.height);
  renderer.render(scene, monoCam);
  renderer.clearDepth();
  renderer.render(uiScene, monoCam);
}

// ---- 2D / 3D toggle ----------------------------------------------------------------------
// 2D = both eyes from the same viewpoint (flat image, lens on). 3D = the normal stereo pair.
const modeEl = document.getElementById('mode');
const btn2d = modeEl.querySelector('[data-mode="2d"]');
const btn3d = modeEl.querySelector('[data-mode="3d"]');
let wall = null, handle = null;
const setModeUI = (is3d) => {
  btn2d.setAttribute('aria-pressed', String(!is3d));
  btn3d.setAttribute('aria-pressed', String(is3d));
};
function setStereo(on) {
  if (!wall?.supported) return;
  const now = performance.now();
  stepStereo(now);
  stereoFrom = stereo; stereoTo = on ? 1 : 0; stereoT0 = now;
  setModeUI(on);
}
// Drop focus after a mouse click, so later key presses (T, L, -/=) don't act on the button.
btn2d.addEventListener('click', (e) => { setStereo(false); if (e.detail) btn2d.blur(); });
btn3d.addEventListener('click', (e) => { setStereo(true); if (e.detail) btn3d.blur(); });

// ---- 3D buttons ---------------------------------------------------------------------------
// The 2D/3D toggle drawn as real geometry so it has depth on the panel: a hovered button rises
// out of the glass, a pressed one sinks into it. Each pill tracks its (invisible) DOM button's
// rect, mapped onto the portal plane z = 0, where screen position is the same for both eyes.
const BTN = { rest: 0.002, hover: 0.006, press: -0.0005, thick: 0.004, ease: 14, labelLift: 0.0065 };
const COL = { fg: '#f1e8d2', bg: '#0b1a17', sel: '#5f968c', unsel: '#365650', bodyOpacity: 0.75 };  // same hue: unsel = base x2, sel = base x3.5 (base #1b2b28)
// The buttons live in their own scene, drawn over the map with a matching key light (no shadow
// maps), so the map's relief, which stands taller than the buttons, never shadows them.
const uiScene = new THREE.Scene();
uiScene.environment = scene.environment;
uiScene.environmentIntensity = scene.environmentIntensity;
var uiKey = new THREE.DirectionalLight(0xfff1dc, key.intensity);
uiKey.position.copy(key.position);
uiScene.add(uiKey, uiKey.target, fill.clone());
const uiGroup = new THREE.Group();
uiScene.add(uiGroup);
// A pill whose front face is a shallow bowl: the rim stays at the front, the face curves down
// to a flat floor BOWL deep (fraction of the thickness). Unit height, unit depth centred on
// z = 0; built from concentric stadium rings so the face can curve (an extruded cap can't).
const BOWL = 0.5;
const bowlCache = new Map();
function stadiumPoint(a, r, u, out) {
  // Point at parameter u in [0,1) around a stadium of half-straight length a and end radius r.
  const L = 4 * a + 2 * Math.PI * r;
  let s = u * L;
  if (s < 2 * a) return out.set(-a + s, -r);
  s -= 2 * a;
  if (s < Math.PI * r) { const t = -Math.PI / 2 + s / r; return out.set(a + r * Math.cos(t), r * Math.sin(t)); }
  s -= Math.PI * r;
  if (s < 2 * a) return out.set(a - s, r);
  s -= 2 * a;
  const t = Math.PI / 2 + s / r;
  return out.set(-a + r * Math.cos(t), r * Math.sin(t));
}
function bowlGeo(ratio) {
  const key = Math.max(1, ratio).toFixed(2);
  if (bowlCache.has(key)) return bowlCache.get(key);
  const w = +key, a = (w - 1) / 2, R = 0.5, M = 96, RINGS = 14;
  const pos = [], idx = [], v = new THREE.Vector2();
  const ring = (r, z) => { const start = pos.length / 3; for (let i = 0; i < M; i++) { stadiumPoint(a, r, i / M, v); pos.push(v.x, v.y, z); } return start; };
  const stitch = (s0, s1, flip) => {
    for (let i = 0; i < M; i++) {
      const j = (i + 1) % M, A = s0 + i, B = s0 + j, C = s1 + i, D = s1 + j;
      if (flip) idx.push(A, C, B, B, C, D); else idx.push(A, B, C, B, D, C);
    }
  };
  // Front bowl: rings from the rim (z = +0.5) inward; depth eases to the flat floor by halfway.
  const bowlZ = (t) => 0.5 - BOWL * (t >= 0.5 ? 1 : (1 - Math.cos(Math.PI * t / 0.5)) / 2);
  let prev = ring(R, 0.5);
  const rim = prev;
  for (let k = 1; k <= RINGS; k++) {
    // The last ring has zero radius: it collapses onto the centre line, closing the face.
    const t = k / RINGS, cur = ring(R * (1 - t), bowlZ(t));
    stitch(prev, cur, false);
    prev = cur;
  }
  // Side wall down to the back, then a flat back cap.
  const back = ring(R, -0.5);
  stitch(back, rim, false);
  const capC = pos.length / 3; pos.push(0, 0, -0.5);

  // Not the DisplayXR Browser (or no 3D display): plain flat page.
  setModeUI(false);
  btn2d.disabled = btn3d.disabled = true;
  modeEl.title = 'Needs the DisplayXR Browser on a 3D display';
  sizeStore();
  addEventListener('resize', sizeStore);
  renderer.setAnimationLoop(monoTick);
} else {
  sbs = true;
  if (q.get('cursor') === 'sdk' && dxrThree.DepthCursor) setupSdkCursor();
  else {
    cursorState.active = true;
    document.documentElement.classList.add('cursor3d');
  }
  sizeStore();
  wall.session.updateRenderState({ depthNear: NEAR, depthFar: FAR });
  handle = wall.addScene(canvas, onFrame, { virtualDisplayHeight: portalHeight() });
  pushRig();
  updateNominal().catch(console.error);
  addEventListener('resize', () => {
    pushRig();
    updateNominal().catch(console.error);
    if (sizeStore()) replayLastGood();
  });
  if (inline3dDisplayModesSupported()) {
    wall.on('renderingmodechange', () => syncMode().catch(console.error));
    syncMode().catch(console.error);
  }
}
</script>
</body>
</html>
